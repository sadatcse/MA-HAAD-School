<svg xmlns="http://www.w3.org/2000/svg" viewBox="-32 12 360 360" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#02A8E6"/>
      <stop offset="0.45" stop-color="#0D82C5"/>
      <stop offset="1" stop-color="#126CB5"/>
    </linearGradient>
    <clipPath id="innerClip">
      <path d="M26 76 Q148 8 270 76 L270 194 C270 282 205 320 148 342 C91 320 26 282 26 194 Z"/>
    </clipPath>
  </defs>
  <g id="shield">
    <!-- outer outline -->
    <path d="M7 62 Q148 -18 289 62 L289 192 C289 292 215 336 148 362 C81 336 7 292 7 192 Z"
          fill="none" stroke="url(#shieldGrad)" stroke-width="12" stroke-linejoin="round"/>
    <!-- inner field -->
    <path d="M26 76 Q148 8 270 76 L270 194 C270 282 205 320 148 342 C91 320 26 282 26 194 Z" fill="url(#shieldGrad)"/>
    <!-- inset border + dividers -->
    <g clip-path="url(#innerClip)" fill="none" stroke="#fff">
      <path d="M38 84 Q148 22 258 84 L258 194 C258 274 200 308 148 328 C96 308 38 274 38 194 Z" stroke-width="4" opacity="0.85"/>
      <path d="M148 0 L148 182 M148 182 L0 262 M148 182 L296 262" stroke-width="10" stroke-linecap="square"/>
    </g>
    <!-- crossed quills -->
    <g fill="#fff" stroke="#fff" stroke-linecap="round">
      <path d="M52 96 L116 156 M116 96 L52 156" stroke-width="12"/>
      <ellipse cx="54" cy="98" rx="14" ry="6" transform="rotate(-45 54 98)" stroke="none"/>
      <ellipse cx="114" cy="98" rx="14" ry="6" transform="rotate(45 114 98)" stroke="none"/>
      <circle cx="50" cy="158" r="10" stroke="none"/>
      <circle cx="118" cy="158" r="10" stroke="none"/>
    </g>
    <!-- star -->
    <path fill="#fff" d="M207.0 84.0 L215.2 108.7 L241.2 108.9 L220.3 124.3 L228.2 149.1 L207.0 134.0 L185.8 149.1 L193.7 124.3 L172.8 108.9 L198.8 108.7 Z"/>
    <!-- open book -->
    <g fill="none" stroke="#fff" stroke-linejoin="round">
      <rect x="102" y="232" width="90" height="54" stroke-width="8"/>
      <path d="M147 232 L147 286" stroke-width="8"/>
      <path d="M100 292 L194 292" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>
</svg>
